name: E2E (PX4 SITL)

on:
  schedule:
    # Nightly at 02:00 UTC — not on every PR due to PX4 build time
    - cron: "0 2 * * *"
  workflow_dispatch:   # allow manual runs

jobs:
  e2e-px4-sitl:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # ── SimUAV build ──────────────────────────────────────────────────────

      - name: Install SimUAV dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libeigen3-dev build-essential gcc-12 g++-12

      - name: Cache MAVLink headers
        id: cache-mavlink
        uses: actions/cache@v4
        with:
          path: third_party/mavlink-c-library
          key: mavlink-c-library-v1

      - name: Clone MAVLink headers
        if: steps.cache-mavlink.outputs.cache-hit != 'true'
        run: git clone --depth=1 https://github.com/mavlink/c_library_v2.git third_party/mavlink-c-library

      - name: Cache CMake FetchContent downloads
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: cmake-deps-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: cmake-deps-

      - name: Build SimUAV
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DBUILD_TESTS=OFF
          cmake --build build -j4

      # ── PX4 SITL ──────────────────────────────────────────────────────────

      - name: Install PX4 system dependencies
        # Matches the unconditional block in PX4 Tools/setup/ubuntu.sh plus
        # the headless-SITL subset (no Gazebo, no Java, no arm-none-eabi).
        run: |
          sudo apt-get update -y --quiet
          sudo apt-get install -y \
            build-essential cmake make \
            gcc g++ \
            python3-venv python3-dev python3-pip python3-setuptools python3-wheel \
            git wget ninja-build \
            libxml2-dev libxml2-utils xmlstarlet \
            libopencv-dev libeigen3-dev \
            bc unzip zip rsync file \
            protobuf-compiler

      - name: Cache PX4 source
        id: cache-px4
        uses: actions/cache@v4
        with:
          path: px4-autopilot
          # v2: bust cache that was poisoned by a failed build (binary missing)
          key: px4-v1.14-v2-${{ runner.os }}

      - name: Clone PX4 v1.14
        if: steps.cache-px4.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 --branch v1.14.0 \
            https://github.com/PX4/PX4-Autopilot.git px4-autopilot
          cd px4-autopilot
          # Annotated tags in shallow clones are tag objects, not commits, so
          # git describe --match 'v[0-9]*' cannot resolve them and returns a
          # bare hash, which makes px_update_git_header.py crash with IndexError.
          # Replace the annotated tag with a lightweight tag at HEAD.
          git tag -d v1.14.0 2>/dev/null || true
          git tag v1.14.0
          git submodule update --init --recursive --depth=1
          # px_update_git_header.py also looks up nuttx-X.Y.Z tags in the NuttX
          # submodule; shallow clone has none → IndexError on list[-1].
          # Patch to fall back to a placeholder version when no tag is present.
          python3 - <<'PYEOF'
          import sys
          path = 'src/lib/version/px_update_git_header.py'
          try:
              with open(path) as f:
                  text = f.read()
              old = "re.findall(r'nuttx-[0-9]+\\.[0-9]+\\.[0-9]+', nuttx_git_tags)[-1]"
              new = "(re.findall(r'nuttx-[0-9]+\\.[0-9]+\\.[0-9]+', nuttx_git_tags) or ['nuttx-12.0.0'])[-1]"
              if old in text:
                  with open(path, 'w') as f:
                      f.write(text.replace(old, new))
                  print('Patched px_update_git_header.py: NuttX shallow-clone fallback')
              else:
                  print('WARNING: nuttx patch pattern not found — may have changed upstream')
          except FileNotFoundError:
              print(f'WARNING: {path} not found', file=sys.stderr)
          PYEOF

      # Use a venv to avoid PEP 668 "externally-managed-environment" errors
      # that occur with Python 3.12+ system pip.
      - name: Set up Python venv
        run: python3 -m venv .venv

      - name: Cache pip venv
        uses: actions/cache@v4
        with:
          path: .venv
          # v3: cache key bumped to force rebuild with empy==3.3.4 pinned
          key: pip-venv-${{ hashFiles('px4-autopilot/Tools/setup/requirements.txt') }}-v3
          restore-keys: pip-venv-

      - name: Install PX4 Python requirements
        run: |
          .venv/bin/pip install --upgrade pip
          # pip ≥25 rejects '>=X.Y.*' (wildcard suffix only valid with == / !=).
          # PX4 v1.14 requirements.txt uses this form; strip the suffix in-place.
          sed -i 's/>=\([0-9][0-9.]*\)\.\*/>=\1/g' px4-autopilot/Tools/setup/requirements.txt
          .venv/bin/pip install -r px4-autopilot/Tools/setup/requirements.txt
          # empy 4.x removed RAW_OPT used by PX4 v1.14 build scripts; force 3.3.4.
          .venv/bin/pip install 'empy==3.3.4'
          # kconfiglib provides the 'menuconfig' module required by PX4's
          # cmake/kconfig.cmake at SITL startup. It is not in requirements.txt
          # for v1.14.0 but is checked at cmake configure time.
          .venv/bin/pip install kconfiglib

      - name: Install pymavlink
        run: .venv/bin/pip install pymavlink

      # ── Build PX4 SITL binary (separate step so it is cached before the test) ──
      # The px4-autopilot cache path includes build/ so the compiled binary
      # persists across runs. Subsequent runs hit the cache and skip this step.
      - name: Build PX4 SITL binary
        run: |
          if [ ! -f px4-autopilot/build/px4_sitl_default/bin/px4 ]; then
            source .venv/bin/activate
            make -C px4-autopilot px4_sitl_default -j4
          else
            echo "PX4 SITL binary already present — skipping build"
          fi

      # ── Run end-to-end test ───────────────────────────────────────────────

      - name: Run E2E test
        # Activate the venv so that cmake's find_package(Python3) resolves to
        # the venv interpreter (which has kconfiglib) instead of /usr/bin/python3
        # when PX4's kconfig.cmake runs on a fresh (cache-miss) build.
        run: |
          source .venv/bin/activate
          python3 scripts/e2e_px4_sitl.py \
            --px4-src px4-autopilot \
            --simuav ./build/simuav \
            --gps-timeout 60 \
            --arm-timeout 30

      - name: Upload telemetry on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-px4-e2e
          path: |
            telemetry.ulg
            telemetry.json
          if-no-files-found: ignore
